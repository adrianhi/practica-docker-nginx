<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Docker Compose - Nginx</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 60px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #00d2ff;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #e0e0e0;
        }
        .badge {
            display: inline-block;
            background-color: #009639;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Hola Mundo!</h1>
        <p>Servidor web <strong>Nginx</strong> corriendo localmente mediante <strong>Docker Compose</strong>.</p>
        <div class="badge">Nginx + Docker Compose Activo</div>
        <div class="footer">
            <p>Práctica DevOps - ITLA</p>
        </div>
    </div>
</body>
</html>
